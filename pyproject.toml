[project]
name = "pubg-analytics"
version = "0.1.0"
description = "PUBG telemetry warehouse: collection, dimensional modelling, skill rating and balance analytics"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "httpx>=0.27",
    "openskill>=6.2.0",
    "orjson>=3.10",
    "polars>=1.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
pubg = "pubg_analytics.collect:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubg_analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
